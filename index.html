<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ's films</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e15800;
            color: #1a1a1a;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .heart-beat {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-yellow-400 selection:text-black">

    <header class="w-full py-12 px-4 text-center relative overflow-hidden">
        <div class="max-w-4xl mx-auto relative z-10">
            <div class="inline-block p-3 rounded-full bg-black/10 text-black mb-4 heart-beat">
                <i class="fas fa-heart text-3xl"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-2 text-black" id="couple-names">
                João & Mari
            </h1>
            <p class="text-black/80 font-medium text-sm md:text-base">Filmes para ver juntos</p>
            
            <!-- Relationship Counter Card -->
            <div class="mt-8 glass-card rounded-2xl p-6 max-w-2xl mx-auto shadow-2xl">
                <h3 class="text-xs uppercase tracking-wider text-black font-bold mb-4">Tempo Juntos</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div class="bg-black/20 p-3 rounded-xl border border-black/10">
                        <span id="days" class="text-2xl md:text-3xl font-bold text-black block">0</span>
                        <span class="text-xs text-black/80 font-medium">Dias</span>
                    </div>
                    <div class="bg-black/20 p-3 rounded-xl border border-black/10">
                        <span id="hours" class="text-2xl md:text-3xl font-bold text-black block">0</span>
                        <span class="text-xs text-black/80 font-medium">Horas</span>
                    </div>
                    <div class="bg-black/20 p-3 rounded-xl border border-black/10">
                        <span id="minutes" class="text-2xl md:text-3xl font-bold text-black block">0</span>
                        <span class="text-xs text-black/80 font-medium">Minutos</span>
                    </div>
                    <div class="bg-black/20 p-3 rounded-xl border border-black/10">
                        <span id="seconds" class="text-2xl md:text-3xl font-bold text-black block">0</span>
                        <span class="text-xs text-black/80 font-medium">Segundos</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow">
        
        <!-- Navigation Buttons -->
        <div class="flex flex-wrap justify-center gap-4 mb-8">
            <button onclick="switchTab('movies')" id="btn-movies" class="px-6 py-2.5 rounded-xl font-bold transition-all bg-yellow-400 text-black shadow-lg hover:bg-yellow-300 border-2 border-black">
                <i class="fas fa-film mr-2"></i> Nossa Lista de Filmes
            </button>
            <button onclick="openRandomizer()" class="px-6 py-2.5 rounded-xl font-bold transition-all bg-black text-yellow-400 shadow-lg hover:bg-gray-900 border-2 border-yellow-400 flex items-center">
                <i class="fas fa-dice mr-2"></i> Sortear Filme 🎲
            </button>
            <button onclick="switchTab('settings')" id="btn-settings" class="px-6 py-2.5 rounded-xl font-bold transition-all bg-black text-white hover:bg-gray-900 border-2 border-black">
                <i class="fas fa-cog mr-2"></i> Configurar Datas
            </button>
        </div>

        <!-- Section: Movies -->
        <div id="section-movies" class="space-y-6">
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-black flex items-center justify-between">
                    <span>Adicionar Filme ou Série</span>
                    <i class="fas fa-video text-black"></i>
                </h2>
                <form id="movie-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="movie-title" placeholder="Nome do Filme/Série" required 
                        class="bg-white/90 border-2 border-black rounded-xl px-4 py-2.5 text-black placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <select id="movie-category" class="bg-white/90 border-2 border-black rounded-xl px-4 py-2.5 text-black focus:outline-none focus:ring-2 focus:ring-yellow-400">
                        <option value="Vamos Assistir">Vamos Assistir</option>
                        <option value="Já Assistimos">Já Assistimos ❤️</option>
                    </select>
                    <button type="submit" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold rounded-xl px-6 py-2.5 transition-all shadow-md border-2 border-black">
                        Adicionar
                    </button>
                </form>
            </div>

            <!-- Movies List Grid -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-black">Lista de Filmes</h2>
                    <span id="movie-count" class="text-xs bg-black text-yellow-400 font-bold px-3 py-1 rounded-full border border-yellow-400">0 itens</span>
                </div>
                <div id="movies-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Items -->
                </div>
            </div>
        </div>

        <!-- Section: Settings -->
        <div id="section-settings" class="hidden space-y-6">
            <div class="glass-card rounded-2xl p-6 shadow-xl max-w-xl mx-auto">
                <h2 class="text-xl font-bold mb-4 text-black">Personalizar Dados do Casal</h2>
                <form id="settings-form" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-black font-bold mb-2">Nomes do Casal</label>
                        <input type="text" id="input-names" value="João & Mari" required
                            class="w-full bg-white/90 border-2 border-black rounded-xl px-4 py-2.5 text-black focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-black font-bold mb-2">Data e Hora de Início</label>
                        <input type="datetime-local" id="input-date" required
                            class="w-full bg-white/90 border-2 border-black rounded-xl px-4 py-2.5 text-black focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                    <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-bold rounded-xl py-3 transition-all shadow-md border-2 border-black">
                        Salvar Alterações
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- Randomizer Modal -->
    <div id="randomizer-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-[#e15800] border-4 border-black rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative">
            <button onclick="closeRandomizer()" class="absolute top-4 right-4 text-black hover:text-white font-bold text-xl bg-yellow-400 w-8 h-8 rounded-full border-2 border-black flex items-center justify-center">
                &times;
            </button>
            <div class="text-4xl mb-3">🎲🎬</div>
            <h3 class="text-2xl font-bold text-black mb-2">Sorteio de Filme</h3>
            <p class="text-black/80 text-sm mb-6">Filme escolhido da lista "Vamos Assistir":</p>
            <div id="randomizer-result" class="bg-black/20 border-2 border-black rounded-2xl p-6 text-2xl font-bold text-black mb-6 min-h-[100px] flex items-center justify-center">
                Clique no botão abaixo para sortear!
            </div>
            <button onclick="pickRandomMovie()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-bold rounded-xl py-3.5 transition-all shadow-md border-2 border-black text-lg">
                Sortear Agora 🎲
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-black font-bold border-t border-black/20 mt-12">
        Mari + João = ☀️ 
    </footer>

    <script>
        // Default Data & LocalStorage Management
        let appData = JSON.parse(localStorage.getItem('coupleAppData')) || {
            names: "João & Mari",
            startDate: "2026-09-20T18:41",
            movies: [ ]
        };

        // Initialize Settings UI values
        document.getElementById('input-names').value = appData.names;
        document.getElementById('input-date').value = appData.startDate;
        document.getElementById('couple-names').innerText = appData.names;

        // Counter Timer Logic
        function updateCounter() {
            const startTimestamp = new Date(appData.startDate).getTime();
            const now = new Date().getTime();
            const diff = now - startTimestamp;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = hours;
                document.getElementById('minutes').innerText = minutes;
                document.getElementById('seconds').innerText = seconds;
            }
        }
        setInterval(updateCounter, 1000);
        updateCounter();

        // Tabs Switching
        function switchTab(tab) {
            const btnMovies = document.getElementById('btn-movies');
            const btnSettings = document.getElementById('btn-settings');
            const secMovies = document.getElementById('section-movies');
            const secSettings = document.getElementById('section-settings');

            if (tab === 'movies') {
                btnMovies.className = "px-6 py-2.5 rounded-xl font-bold transition-all bg-yellow-400 text-black shadow-lg hover:bg-yellow-300 border-2 border-black";
                btnSettings.className = "px-6 py-2.5 rounded-xl font-bold transition-all bg-black text-white hover:bg-gray-900 border-2 border-black";
                secMovies.classList.remove('hidden');
                secSettings.classList.add('hidden');
            } else {
                btnSettings.className = "px-6 py-2.5 rounded-xl font-bold transition-all bg-yellow-400 text-black shadow-lg hover:bg-yellow-300 border-2 border-black";
                btnMovies.className = "px-6 py-2.5 rounded-xl font-bold transition-all bg-black text-white hover:bg-gray-900 border-2 border-black";
                secSettings.classList.remove('hidden');
                secMovies.classList.add('hidden');
            }
        }

        // Randomizer Modal Controls
        function openRandomizer() {
            document.getElementById('randomizer-modal').classList.remove('hidden');
            document.getElementById('randomizer-modal').classList.add('flex');
            document.getElementById('randomizer-result').innerText = "Clique no botão abaixo para sortear!";
        }

        function closeRandomizer() {
            document.getElementById('randomizer-modal').classList.add('hidden');
            document.getElementById('randomizer-modal').classList.remove('flex');
        }

        function pickRandomMovie() {
            const watchList = appData.movies.filter(m => m.category === "Vamos Assistir");
            const resultBox = document.getElementById('randomizer-result');

            if (watchList.length === 0) {
                resultBox.innerText = "Nenhum filme na lista 'Vamos Assistir'!";
                return;
            }

            // Animation effect
            resultBox.innerText = "Sorteando...";
            let counter = 0;
            const interval = setInterval(() => {
                const randomItem = watchList[Math.floor(Math.random() * watchList.length)];
                resultBox.innerText = randomItem.title;
                counter++;
                if (counter > 10) {
                    clearInterval(interval);
                    const finalChoice = watchList[Math.floor(Math.random() * watchList.length)];
                    resultBox.innerText = `🎬 ${finalChoice.title}`;
                }
            }, 80);
        }

        // Render Movies
        function renderMovies() {
            const container = document.getElementById('movies-container');
            const countBadge = document.getElementById('movie-count');
            container.innerHTML = '';
            countBadge.innerText = `${appData.movies.length} itens`;

            if (appData.movies.length === 0) {
                container.innerHTML = `<p class="text-black/80 font-medium text-center col-span-2 py-4">Nenhum filme adicionado ainda.</p>`;
                return;
            }

            appData.movies.forEach(movie => {
                let badgeColor = "bg-yellow-300 text-black border-black";
                if (movie.category === "Já Assistimos") badgeColor = "bg-black text-yellow-400 border-yellow-400";

                const card = document.createElement('div');
                card.className = "bg-white/20 border-2 border-black p-4 rounded-xl flex items-center justify-between shadow-md";
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-black mb-1">${escapeHtml(movie.title)}</h4>
                        <span class="text-xs font-bold px-2.5 py-1 rounded-full border ${badgeColor}">${escapeHtml(movie.category)}</span>
                    </div>
                    <button onclick="deleteMovie(${movie.id})" class="text-black hover:text-red-700 transition-colors p-2 bg-yellow-400 rounded-lg border-2 border-black">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // Add Movie Handler
        document.getElementById('movie-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('movie-title');
            const categoryInput = document.getElementById('movie-category');

            const newMovie = {
                id: Date.now(),
                title: titleInput.value.trim(),
                category: categoryInput.value
            };

            appData.movies.push(newMovie);
            saveAndRefresh();
            titleInput.value = '';
        });

        // Delete Movie
        function deleteMovie(id) {
            appData.movies = appData.movies.filter(m => m.id !== id);
            saveAndRefresh();
        }

        // Settings Handler
        document.getElementById('settings-form').addEventListener('submit', (e) => {
            e.preventDefault();
            appData.names = document.getElementById('input-names').value.trim();
            appData.startDate = document.getElementById('input-date').value;
            document.getElementById('couple-names').innerText = appData.names;
            saveAndRefresh();
            switchTab('movies');
        });

        // Save to LocalStorage and update view
        function saveAndRefresh() {
            localStorage.setItem('coupleAppData', JSON.stringify(appData));
            renderMovies();
        }

        // Helper to prevent XSS
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Initial render
        renderMovies();
    </script>
</body>
</html>
