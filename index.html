<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ's films</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e15800;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 88, 0, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 66, 0, 0.4);
        }
        .heart-beat {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <!-- Header / Hero Section -->
    <header class="w-full py-12 px-4 text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-rose-900/20 via-purple-900/20 to-slate-900/25 z-0"></div>
        <div class="max-w-4xl mx-auto relative z-10">
            <div class="inline-block p-3 rounded-full bg-rose-500/10 text-rose-500 mb-4 heart-beat">
                <i class="fas fa-heart text-3xl"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-2 text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-pink-300" id="couple-names">
                João & Mari
            </h1>
            <p class="text-slate-400 text-sm md:text-base">Filmes para ver juntos</p>
            
            <!-- Relationship Counter Card -->
            <div class="mt-8 glass-card rounded-2xl p-6 max-w-2xl mx-auto shadow-2xl">
                <h3 class="text-xs uppercase tracking-wider text-rose-400 font-semibold mb-4">Tempo Juntos</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                        <span id="days" class="text-2xl md:text-3xl font-bold text-white block">0</span>
                        <span class="text-xs text-slate-400">Dias</span>
                    </div>
                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                        <span id="hours" class="text-2xl md:text-3xl font-bold text-white block">0</span>
                        <span class="text-xs text-slate-400">Horas</span>
                    </div>
                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                        <span id="minutes" class="text-2xl md:text-3xl font-bold text-white block">0</span>
                        <span class="text-xs text-slate-400">Minutos</span>
                    </div>
                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                        <span id="seconds" class="text-2xl md:text-3xl font-bold text-rose-400 block">0</span>
                        <span class="text-xs text-slate-400">Segundos</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Tabs / Sections -->
    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow">
        
        <!-- Navigation Buttons -->
        <div class="flex justify-center gap-4 mb-8">
            <button onclick="switchTab('movies')" id="btn-movies" class="px-6 py-2.5 rounded-xl font-medium transition-all bg-rose-600 text-white shadow-lg shadow-rose-600/30">
                <i class="fas fa-film mr-2"></i> Nossa Lista de Filmes
            </button>
            <button onclick="switchTab('settings')" id="btn-settings" class="px-6 py-2.5 rounded-xl font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700">
                <i class="fas fa-cog mr-2"></i> Configurar Datas
            </button>
        </div>

        <!-- Section: Movies -->
        <div id="section-movies" class="space-y-6">
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-semibold mb-4 text-slate-100 flex items-center justify-between">
                    <span>Adicionar Filme ou Série</span>
                    <i class="fas fa-video text-rose-400"></i>
                </h2>
                <form id="movie-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="movie-title" placeholder="Nome do Filme/Série" required 
                        class="bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-rose-500">
                    <select id="movie-category" class="bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-rose-500">
                        <option value="Quero Assistir">Vamos Assistir</option>
                        <option value="Já Assistimos">Já Assistimos ❤️</option>
                    </select>
                    <button type="submit" class="bg-rose-600 hover:bg-rose-500 text-white font-medium rounded-xl px-6 py-2.5 transition-all shadow-lg shadow-rose-600/20">
                        Adicionar
                    </button>
                </form>
            </div>

            <!-- Movies List Grid -->
            <div class="glass-card rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold text-slate-100">Lista de Filmes</h2>
                    <span id="movie-count" class="text-xs bg-slate-800 text-rose-400 px-3 py-1 rounded-full border border-slate-700">0 itens</span>
                </div>
                <div id="movies-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Items -->
                </div>
            </div>
        </div>

        <!-- Section: Settings -->
        <div id="section-settings" class="hidden space-y-6">
            <div class="glass-card rounded-2xl p-6 shadow-xl max-w-xl mx-auto">
                <h2 class="text-xl font-semibold mb-4 text-slate-100">Personalizar Dados do Casal</h2>
                <form id="settings-form" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Nomes do Casal</label>
                        <input type="text" id="input-names" value="João & Mari" required
                            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Data e Hora de Início</label>
                        <input type="datetime-local" id="input-date" required
                            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-rose-500">
                    </div>
                    <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium rounded-xl py-3 transition-all shadow-lg shadow-rose-600/20">
                        Salvar Alterações
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800/80 mt-12">
        MJ FILMS.
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Default Data & LocalStorage Management
        let appData = JSON.parse(localStorage.getItem('coupleAppData')) || {
            names: "João & Mari",
            startDate: "2026-09-20T18:41",
            movies: []
        };

        // Initialize Settings UI values
        document.getElementById('input-names').value = appData.names;
        document.getElementById('input-date').value = appData.startDate;
        document.getElementById('couple-names').innerText = appData.names;

        // Counter Timer Logic
        function updateCounter() {
            const startTimestamp = new Date(appData.startDate).getTime();
            const now = new Date().getTime();
            const diff = now - startTimestamp;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = hours;
                document.getElementById('minutes').innerText = minutes;
                document.getElementById('seconds').innerText = seconds;
            }
        }
        setInterval(updateCounter, 1000);
        updateCounter();

        // Tabs Switching
        function switchTab(tab) {
            const btnMovies = document.getElementById('btn-movies');
            const btnSettings = document.getElementById('btn-settings');
            const secMovies = document.getElementById('section-movies');
            const secSettings = document.getElementById('section-settings');

            if (tab === 'movies') {
                btnMovies.className = "px-6 py-2.5 rounded-xl font-medium transition-all bg-rose-600 text-white shadow-lg shadow-rose-600/30";
                btnSettings.className = "px-6 py-2.5 rounded-xl font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700";
                secMovies.classList.remove('hidden');
                secSettings.classList.add('hidden');
            } else {
                btnSettings.className = "px-6 py-2.5 rounded-xl font-medium transition-all bg-rose-600 text-white shadow-lg shadow-rose-600/30";
                btnMovies.className = "px-6 py-2.5 rounded-xl font-medium transition-all bg-slate-800 text-slate-300 hover:bg-slate-700";
                secSettings.classList.remove('hidden');
                secMovies.classList.add('hidden');
            }
        }

        // Render Movies
        function renderMovies() {
            const container = document.getElementById('movies-container');
            const countBadge = document.getElementById('movie-count');
            container.innerHTML = '';
            countBadge.innerText = `${appData.movies.length} itens`;

            if (appData.movies.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center col-span-2 py-4">Nenhum filme adicionado ainda.</p>`;
                return;
            }

            appData.movies.forEach(movie => {
                let badgeColor = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                if (movie.category === "Já Assistimos") badgeColor = "bg-rose-500/10 text-rose-400 border-rose-500/20";
                if (movie.category === "Assistindo") badgeColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";

                const card = document.createElement('div');
                card.className = "bg-slate-800/40 border border-slate-700/60 p-4 rounded-xl flex items-center justify-between";
                card.innerHTML = `
                    <div>
                        <h4 class="font-medium text-white mb-1">${escapeHtml(movie.title)}</h4>
                        <span class="text-xs px-2.5 py-1 rounded-full border ${badgeColor}">${escapeHtml(movie.category)}</span>
                    </div>
                    <button onclick="deleteMovie(${movie.id})" class="text-slate-500 hover:text-rose-400 transition-colors p-2">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // Add Movie Handler
        document.getElementById('movie-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('movie-title');
            const categoryInput = document.getElementById('movie-category');

            const newMovie = {
                id: Date.now(),
                title: titleInput.value.trim(),
                category: categoryInput.value
            };

            appData.movies.push(newMovie);
            saveAndRefresh();
            titleInput.value = '';
        });

        // Delete Movie
        function deleteMovie(id) {
            appData.movies = appData.movies.filter(m => m.id !== id);
            saveAndRefresh();
        }

        // Settings Handler
        document.getElementById('settings-form').addEventListener('submit', (e) => {
            e.preventDefault();
            appData.names = document.getElementById('input-names').value.trim();
            appData.startDate = document.getElementById('input-date').value;
            document.getElementById('couple-names').innerText = appData.names;
            saveAndRefresh();
            switchTab('movies');
        });

        // Save to LocalStorage and update view
        function saveAndRefresh() {
            localStorage.setItem('coupleAppData', JSON.stringify(appData));
            renderMovies();
        }

        // Helper to prevent XSS
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Initial render
        renderMovies();
    </script>
</body>
</html>
